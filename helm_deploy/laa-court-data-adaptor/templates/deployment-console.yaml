{{- $console := .Values.console | default dict }}
{{- if $console.enabled }}
{{- $consoleName := printf "%s-console" (include "laa-court-data-adaptor.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $consoleName }}
spec:
  replicas: {{ $console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $consoleName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $consoleName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: console
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sleep"]
          args: ["infinity"]
          {{- $envContext := merge (dict "databaseSecretName" (required "console database secret name is required" $console.databaseSecret.name)) . }}
          {{ include "laa-court-data-adaptor.env-vars" $envContext | nindent 10 }}
          resources:
            {{- toYaml $console.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
