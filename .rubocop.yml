inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance

inherit_gem:
  rubocop-govuk:
    - config/default.yml
    - config/rails.yml
    - config/rspec.yml

inherit_mode:
  merge:
    - Exclude

Lint/MissingSuper:
  Exclude:
    - 'app/services/**/*.rb'

# Exclusions to make Rubocop play nicely with RSwag:
RSpec/ScatteredSetup:
  Exclude:
    - 'spec/requests/**/*.rb'
RSpec/ExpectInHook:
  Exclude:
    - 'spec/requests/**/*.rb'
RSpec/VariableName:
  Exclude:
    - 'spec/requests/**/*.rb'
RSpec/EmptyExampleGroup:
  Exclude:
    - 'spec/requests/**/*.rb'
    - 'spec/pact/**/*.rb' # Needed for Pact tests, which have empty example groups

Style/MixinUsage:
  Exclude:
    - 'spec/pact/**/*.rb' # Needed for Pact tests, which won't allow mixins

Rails/Delegate:
  Enabled: false

RSpec/InstanceVariable:
  Exclude:
     - 'spec/pact/providers/laa_maat_court_data_api/maat_reference_validator_spec.rb' # Needed to set the mock server URL in an instance variable for Pact tests
