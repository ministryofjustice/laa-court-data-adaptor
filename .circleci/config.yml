version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.0.0
  aws-ecr: circleci/aws-ecr@9.0.2
  aws-eks: circleci/aws-eks@0.2.1
  kubernetes: circleci/kubernetes@0.7.0
  helm: circleci/helm@1.1.2
  newman: postman/newman@0.0.2
  snyk: snyk/snyk@2.2.0
  court-data-end-to-end-tests: ministryofjustice/court-data-end-to-end-tests@volatile
  jq: circleci/jq@3.0.0
  gh: circleci/github-cli@3.0.0

executors:
  newman-latest:
    docker:
      - image: postman/newman:6.1.3-alpine
  snyk-executor:
    working_directory: ~/repo
    docker:
      - image: cimg/ruby:3.4.4-browsers
        environment:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:circleci@127.0.0.1:5432/cda_test
          TZ: Europe/London
      - image: cimg/postgres:17.11
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "circleci"
          POSTGRES_DB: cda_test

commands:

  set-image-tag:
    steps:
      - run:
          name: Set deployment image tag
          command: |
            if [[ "$CIRCLE_BRANCH" == "main" ]]; then
              IMAGE_TAG="main-$CIRCLE_SHA1"
            else
              IMAGE_TAG="branch-$CIRCLE_SHA1"
            fi
            echo "export IMAGE_TAG=$IMAGE_TAG" >> "$BASH_ENV"

  get-github-token:
    steps:
      - gh/install
      - jq/install
      - run:
          name: Request GitHub token from Octo STS
          command: |
            set -euo pipefail
            set +x

            oidc_token=$(
              circleci run oidc get --claims '{"aud":"octo-sts.dev"}'
            )

            response=$(
              curl --fail-with-body --silent --show-error \
                --header "Authorization: Bearer $oidc_token" \
                --get "https://octo-sts.dev/sts/exchange" \
                --data-urlencode "scope=ministryofjustice/laa-court-data-adaptor" \
                --data-urlencode "identity=laa-court-data-adaptor-release-recorder"
            )

            github_token=$(
              printf '%s' "$response" |
                jq --exit-status --raw-output \
                  '.token | select(type == "string" and length > 0)'
            )

            printf 'export GH_TOKEN=%q\n' "$github_token" >> "$BASH_ENV"

  record-deployment-start:
    parameters:
      environment:
        type: enum
        enum: ["dev", "test", "uat", "production"]
    steps:
      - run:
          name: Record deployment in progress
          environment:
            DEPLOYMENT_ENVIRONMENT: << parameters.environment >>
          command: |
            set -euo pipefail

            repo="ministryofjustice/laa-court-data-adaptor"
            production=false
            if [[ "$DEPLOYMENT_ENVIRONMENT" == "production" ]]; then
              production=true
            fi

            deployment_id=$(
              gh api --method POST "repos/$repo/deployments" \
                -f ref="$CIRCLE_SHA1" \
                -f environment="$DEPLOYMENT_ENVIRONMENT" \
                -F auto_merge=false \
                -F production_environment="$production" \
                -F transient_environment=false \
                -F 'required_contexts[]' \
                -f description="Deployment from CircleCI" \
                --jq '.id'
            )

            printf 'export GITHUB_DEPLOYMENT_ID=%q\n' \
              "$deployment_id" >> "$BASH_ENV"

            gh api --method POST \
              "repos/$repo/deployments/$deployment_id/statuses" \
              -f state="in_progress" \
              -f log_url="$CIRCLE_BUILD_URL" \
              -f description="Deployment started" > /dev/null

  record-deployment-success:
    steps:
      - run:
          name: Record successful deployment
          command: |
            set -euo pipefail

            : "${GITHUB_DEPLOYMENT_ID:?Deployment ID has not been set}"

            repo="ministryofjustice/laa-court-data-adaptor"

            gh api --method POST \
              "repos/$repo/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
              -f state="success" \
              -f log_url="$CIRCLE_BUILD_URL" \
              -f description="Deployment completed" > /dev/null

  build-temp-image:
    steps:
      - run:
          name: Compile Docker Image
          command: |
            docker build \
              --build-arg BUILD_DATE=$(date +%Y-%m-%dT%H:%M:%S%z) \
              --build-arg COMMIT_ID=${CIRCLE_SHA1} \
              --build-arg BUILD_TAG="app-${CIRCLE_SHA1}" \
              --build-arg APP_BRANCH=${CIRCLE_BRANCH} \
              --pull \
              --tag cda:scan \
              --file Dockerfile .

jobs:
  test:
    docker:
      - image: cimg/ruby:3.4.4
        environment:
          PAGER: cat
          DATABASE_URL: postgres://postgres@localhost/laa_court_data_adaptor_test
          RAILS_ENV: test
      - image: cimg/postgres:17.11
        environment:
          POSTGRES_DB: laa_court_data_adaptor_test
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "Gemfile.lock" }}
            - v1-dependencies-

      - run:
          name: install bundle
          command: |
            sudo gem install bundler -N

      - run:
          name: install dependencies
          command: |
            bundle check || bundle install --jobs=4 --retry=3

      - save_cache:
          paths:
            - ./vendor/bundle
          key: v1-dependencies-{{ checksum "Gemfile.lock" }}

      - helm/install-helm-client:
          version: "v3.2.4"

      - run:
          name: Test deployment templates
          command: bundle exec rspec --options /dev/null helm_deploy/laa-court-data-adaptor/spec

      - run:
          name: "Install postgres client 17"
          command: |
            wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
            sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
            sudo apt-get update
            sudo apt-get install postgresql-client-17

      - run:
          name: Database Setup
          command: |
            bundle exec rake db:migrate

      - run:
          name: run tests
          command: |
            mkdir /tmp/test-results
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | \
              circleci tests split --split-by=timings)"

            bundle exec rspec \
              --format progress \
              --format RspecJunitFormatter \
              --out /tmp/test-results/rspec.xml \
              --format progress \
              $TEST_FILES

      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

      - run:
          name: run rubocop
          command: bundle exec rubocop

  build-and-push-app:
    executor: aws-ecr/default
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: $ECR_ROLE_TO_ASSUME
          region: $ECR_REGION
      - run: |
          aws ecr get-login-password --region $ECR_REGION | docker login --username AWS --password-stdin ${AWS_ECR_REGISTRY_ID}.dkr.ecr.${ECR_REGION}.amazonaws.com
      - run:
          name: Set env vars
          command: |
            [[ "$CIRCLE_BRANCH" == "main" ]] && ECR_TAGS="main-$CIRCLE_SHA1,latest" || ECR_TAGS="branch-$CIRCLE_SHA1"
            echo "export ECR_TAGS=$ECR_TAGS" >> "$BASH_ENV"
            echo "export APP_BUILD_DATE=$(date +%Y-%m-%dT%H:%M:%S%z)"  >> "$BASH_ENV"
            source "$BASH_ENV"
      - aws-ecr/build_image:
          push_image: true
          tag: ${ECR_TAGS}
          region: $ECR_REGION
          repo: $ECR_REPOSITORY
          account_id: "754256621582"
          extra_build_args: >-
            --build-arg BUILD_DATE=${APP_BUILD_DATE}
            --build-arg BUILD_TAG=${CIRCLE_SHA1}
            --build-arg COMMIT_ID=${CIRCLE_SHA1}
            --build-arg APP_BRANCH=${CIRCLE_BRANCH}

  install_on_dev_live:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - get-github-token
      - record-deployment-start:
          environment: "dev"
      - set-image-tag
      - kubernetes/install-kubectl
      - helm/install-helm-client:
          version: "v3.2.4"
      - run:
          name: Authenticate to LIVE cluster
          command: |
            echo -n ${CLUSTER_CERT_LIVE} | base64 -d > ./live_ca.crt
            kubectl config set-cluster ${CLUSTER_NAME_LIVE} --certificate-authority=./live_ca.crt --server=https://${CLUSTER_NAME_LIVE}
            kubectl config set-credentials circleci --token=${CIRCLE_CI_TOKEN_DEV_LIVE}
            kubectl config set-context ${CLUSTER_NAME_LIVE} --cluster=${CLUSTER_NAME_LIVE} --user=circleci --namespace=laa-court-data-adaptor-dev
            kubectl config use-context ${CLUSTER_NAME_LIVE}
            kubectl config current-context
            kubectl --namespace=laa-court-data-adaptor-dev get pods
      - helm/upgrade-helm-chart:
          namespace: laa-court-data-adaptor-dev
          update-repositories: false
          chart: ./helm_deploy/laa-court-data-adaptor
          release-name: laa-court-data-adaptor
          values: ./helm_deploy/laa-court-data-adaptor/values/dev.yaml
          values-to-override: image.tag=${IMAGE_TAG}
      - record-deployment-success

  install_on_test_live:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - get-github-token
      - record-deployment-start:
          environment: "test"
      - set-image-tag
      - kubernetes/install-kubectl
      - helm/install-helm-client:
          version: "v3.2.4"
      - run:
          name: Authenticate to LIVE cluster
          command: |
            echo -n ${CLUSTER_CERT_LIVE} | base64 -d > ./live_ca.crt
            kubectl config set-cluster ${CLUSTER_NAME_LIVE} --certificate-authority=./live_ca.crt --server=https://${CLUSTER_NAME_LIVE}
            kubectl config set-credentials circleci --token=${CIRCLE_CI_TOKEN_TEST_LIVE}
            kubectl config set-context ${CLUSTER_NAME_LIVE} --cluster=${CLUSTER_NAME_LIVE} --user=circleci --namespace=laa-court-data-adaptor-test
            kubectl config use-context ${CLUSTER_NAME_LIVE}
            kubectl config current-context
            kubectl --namespace=laa-court-data-adaptor-test get pods
      - helm/upgrade-helm-chart:
          namespace: laa-court-data-adaptor-test
          update-repositories: false
          chart: ./helm_deploy/laa-court-data-adaptor
          release-name: laa-court-data-adaptor
          values: ./helm_deploy/laa-court-data-adaptor/values/test.yaml
          values-to-override: image.tag=${IMAGE_TAG}
      - record-deployment-success

  install_on_uat_live:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - get-github-token
      - record-deployment-start:
          environment: "uat"
      - set-image-tag
      - kubernetes/install-kubectl
      - helm/install-helm-client:
          version: "v3.2.4"
      - run:
          name: Authenticate to LIVE cluster
          command: |
            echo -n ${CLUSTER_CERT_LIVE} | base64 -d > ./live_ca.crt
            kubectl config set-cluster ${CLUSTER_NAME_LIVE} --certificate-authority=./live_ca.crt --server=https://${CLUSTER_NAME_LIVE}
            kubectl config set-credentials circleci --token=${CIRCLE_CI_TOKEN_UAT_LIVE}
            kubectl config set-context ${CLUSTER_NAME_LIVE} --cluster=${CLUSTER_NAME_LIVE} --user=circleci --namespace=laa-court-data-adaptor-uat
            kubectl config use-context ${CLUSTER_NAME_LIVE}
            kubectl config current-context
            kubectl --namespace=laa-court-data-adaptor-uat get pods
      - run:
          name: Deploy to UAT
          command: |
            .circleci/deploy.sh \
              --namespace laa-court-data-adaptor-uat \
              --values-file ./helm_deploy/laa-court-data-adaptor/values/uat.yaml \
              --tag "$IMAGE_TAG" \
              --hmcts-ips "$HMCTS_UAT_IPS"
      - record-deployment-success

  install_on_prod_live:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - get-github-token
      - record-deployment-start:
          environment: "production"
      - set-image-tag
      - kubernetes/install-kubectl
      - helm/install-helm-client:
          version: "v3.2.4"
      - run:
          name: Authenticate to LIVE cluster
          command: |
            echo -n ${CLUSTER_CERT_LIVE} | base64 -d > ./live_ca.crt
            kubectl config set-cluster ${CLUSTER_NAME_LIVE} --certificate-authority=./live_ca.crt --server=https://${CLUSTER_NAME_LIVE}
            kubectl config set-credentials circleci --token=${CIRCLE_CI_TOKEN_PROD_LIVE}
            kubectl config set-context ${CLUSTER_NAME_LIVE} --cluster=${CLUSTER_NAME_LIVE} --user=circleci --namespace=laa-court-data-adaptor-prod
            kubectl config use-context ${CLUSTER_NAME_LIVE}
            kubectl config current-context
            kubectl --namespace=laa-court-data-adaptor-prod get pods
      - run:
          name: Deploy to Production
          command: |
            .circleci/deploy.sh \
              --namespace laa-court-data-adaptor-prod \
              --values-file ./helm_deploy/laa-court-data-adaptor/values/prod.yaml \
              --tag "$IMAGE_TAG" \
              --cert-fingerprint "$HMCTS_CA_FINGERPRINT" \
              --hmcts-ips "$HMCTS_PROD_IPS"
      - record-deployment-success

  postman_test_on_dev:
    executor: newman-latest
    steps:
      - run:
          name: Install Git (for local use)
          command: |
            apk update && apk add git
      - run:
          name: Upgrade Newman to Latest
          command: |
            newman --version
      - checkout
      - newman/newman-run:
          collection: ./postman-collection/runner/tests.postman_collection.json
          environment: ./postman-collection/runner/enviroments/dev.postman_environment.json
          delay-request: "3000"
          additional-options: "--env-var client_id=$DEV_UID --env-var client_secret=$DEV_SECRET"

  scan-docker-image:
    parameters:
      monitor:
        type: boolean
        default: false
    executor: snyk-executor
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - build-temp-image
      - snyk/scan:
          token-variable: SNYK_TOKEN
          docker-image-name: cda:scan
          target-file: ./Dockerfile
          organization: "legal-aid-agency"
          severity-threshold: "critical"
          fail-on-issues: true
          no-output-timeout: 20m
          monitor-on-build: << parameters.monitor >>

  e2e-test-branch:
    executor: court-data-end-to-end-tests/e2e-test-executor
    steps:
      - court-data-end-to-end-tests/run-e2e-tests:
          e2e_current_image_var: CDA_IMAGE
          e2e_current_image: ${AWS_ECR_REGISTRY_ID}.dkr.ecr.${ECR_REGION}.amazonaws.com/${ECR_REPOSITORY}:branch-${CIRCLE_SHA1}
          e2e_branch: main # Change this to work against a fixed e2e test repo branch if needed

  e2e-test-main:
    executor: court-data-end-to-end-tests/e2e-test-executor
    steps:
      - court-data-end-to-end-tests/run-e2e-tests

workflows:
  version: 2
  test-build-deploy-main-to-live-cluster:
    jobs:
      - test:
          filters:
            branches:
              only:
                - main
      - build-and-push-app:
          requires:
            - test
          filters:
            branches:
              only:
                - main
      - scan-docker-image:
          name: scan-and-monitor-docker-image
          monitor: true
          requires:
            - build-and-push-app
      - e2e-test-main:
          requires:
            - build-and-push-app
      - install_on_dev_live:
          requires:
            - build-and-push-app
      - install_on_test_live:
          requires:
            - build-and-push-app
      - install_on_uat_live:
          requires:
            - build-and-push-app
      - hold_install_on_prod:
          type: approval
          requires:
            - build-and-push-app
      - install_on_prod_live:
          requires:
            - hold_install_on_prod

  test-branch:
    jobs:
      - test:
          filters:
            branches:
              ignore:
                - main

  build-deploy-branch-to-live-cluster:
    jobs:
      - build-and-push-app:
          filters:
            branches:
              ignore:
                - main
      - scan-docker-image:
          name: scan-docker-image
          monitor: false
          requires:
            - build-and-push-app
      - e2e-test-branch:
          context: laa-court-data-e2e-tests
          requires:
            - build-and-push-app
      - hold_install_on_dev:
          type: approval
          requires:
            - build-and-push-app
      - install_on_dev_live:
          requires:
            - hold_install_on_dev
      - hold_install_on_test:
          type: approval
          requires:
            - build-and-push-app
      - install_on_test_live:
          requires:
            - hold_install_on_test
      - hold_install_on_uat:
          type: approval
          requires:
            - build-and-push-app
      - install_on_uat_live:
          requires:
            - hold_install_on_uat
      - postman_test_on_dev:
          requires:
            - install_on_dev_live
